<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerothon UAV Toolkit V2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="main">

<h1>Aerothon UAV Design Toolkit</h1>

<h2>Aircraft Inputs</h2>

<div class="grid">

<div class="card">
<h3>Mass (kg)</h3>
<input type="number" id="mass" value="4">
</div>

<div class="card">
<h3>Gravity</h3>
<input type="number" id="g" value="9.81">
</div>

<div class="card">
<h3>Density</h3>
<input type="number" id="rho" value="1.225">
</div>

<div class="card">
<h3>Cruise Speed (m/s)</h3>
<input type="number" id="vc" value="15">
</div>

<div class="card">
<h3>Stall Speed (m/s)</h3>
<input type="number" id="vs" value="8">
</div>

<div class="card">
<h3>Aspect Ratio</h3>
<input type="number" id="arInput" value="8">
</div>

</div>

<h2>Airfoil</h2>

<select id="airfoil">
<option>S1223</option>
<option>NACA 7415</option>
<option>SD7037</option>
<option>NACA 4412</option>
<option>E423</option>
</select>

<br><br>

<button onclick="calculate()">
Calculate
</button>

<h2>Results</h2>

<div class="results">

<div class="result-card">
<h4>Weight</h4>
<p id="weight"></p>
</div>

<div class="result-card">
<h4>Wing Area</h4>
<p id="areaOut"></p>
</div>

<div class="result-card">
<h4>Wing Span</h4>
<p id="spanOut"></p>
</div>

<div class="result-card">
<h4>Chord Length</h4>
<p id="chordOut"></p>
</div>

<div class="result-card">
<h4>Cruise CL</h4>
<p id="cl"></p>
</div>

<div class="result-card">
<h4>Reynolds Number</h4>
<p id="re"></p>
</div>

<div class="result-card">
<h4>Wing Loading</h4>
<p id="wl"></p>
</div>

<div class="result-card">
<h4>Margin</h4>
<p id="margin"></p>
</div>

</div>

<h2>Airfoil Analysis</h2>

<div class="result-card">
<p id="airfoilResult"></p>
</div>

</div>
<script src="js/airfoils.js"></script>
<script src="js/app.js"></script>
</body>
</html>
